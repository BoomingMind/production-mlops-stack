global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'mlops-aqi-monitor'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System metrics (CPU, Memory, Disk)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'host-machine'

  # Flask AQI Application (exposes metrics at /metrics)
  - job_name: 'aqi-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
    scrape_interval: 5s
    scrape_timeout: 5s

  # LLM Metrics (same endpoint, different job for clarity)
  - job_name: 'llm-metrics'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
    scrape_interval: 10s
    scrape_timeout: 10s
    metric_relabel_configs:
      # Only keep LLM and RAG related metrics for this job
      - source_labels: [__name__]
        regex: '(llm_.*|rag_.*|guardrail_.*)'
        action: keep

  # MLflow Server
  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']
    scrape_interval: 30s

# Alerting rules (optional)
# alerting:
