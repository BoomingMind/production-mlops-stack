name: CI/CD Pipeline with LLMOps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== JOB 1: LINT ====================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.1.8 black==23.12.0
          
      - name: Run Ruff linter on src and tests
        run: |
          echo "Running Ruff linter..."
          ruff check src/ tests/ --output-format=github
          
      - name: Run Ruff linter on prompt scripts
        run: |
          echo "Running Ruff linter on prompt experiments..."
          ruff check experiments/prompts/ --output-format=github || true
          
      - name: Run Black formatter check
        run: |
          echo "Checking code formatting with Black..."
          black --check src/ tests/
          
      - name: Lint summary
        if: success()
        run: echo "All linting checks passed!"

  # ==================== JOB 2: PROMPT VALIDATION ====================
  prompt-validation:
    name: Validate Prompts & Templates
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          
      - name: Validate prompt templates exist
        run: |
          echo "Validating prompt templates..."
          for template in zero_shot.txt few_shot_k3.txt few_shot_k5.txt chain_of_thought.txt meta_prompt.txt; do
            if [ -f "experiments/prompts/prompt_templates/$template" ]; then
              echo "✅ Found: $template"
            else
              echo "❌ Missing: $template"
              exit 1
            fi
          done
          
      - name: Validate evaluation dataset
        run: |
          echo "Validating evaluation dataset..."
          python3 << 'EOF'
          import json
          import sys
          
          eval_path = "data/eval.jsonl"
          required_fields = ["aqi", "category", "expected_summary", "expected_precautions"]
          
          try:
              with open(eval_path) as f:
                  count = 0
                  for line in f:
                      if line.strip():
                          data = json.loads(line)
                          for field in required_fields:
                              if field not in data:
                                  print(f"❌ Missing field '{field}' in line {count+1}")
                                  sys.exit(1)
                          count += 1
              
              if count < 5:
                  print(f"❌ Insufficient examples: {count} (minimum 5 required)")
                  sys.exit(1)
              
              print(f"✅ Validated {count} evaluation examples")
          except Exception as e:
              print(f"❌ Validation failed: {e}")
              sys.exit(1)
          EOF
          
      - name: Run prompt template tests
        run: |
          echo "Running prompt template unit tests..."
          pytest tests/test_prompts.py -v --tb=short || echo "Prompt tests completed"

  # ==================== JOB 3: PROMPT EVALUATION ====================
  prompt-evaluation:
    name: Automated Prompt Evaluation
    runs-on: ubuntu-latest
    needs: prompt-validation
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy sentence-transformers rouge-score
          
      - name: Run CI prompt evaluation
        run: |
          echo "Running automated prompt evaluation..."
          python experiments/prompts/ci_evaluate.py || true
          
      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-evaluation-results
          path: experiments/prompts/*.json
          retention-days: 30

  # ==================== JOB 4: TEST WITH COVERAGE ====================
  test:
    name: Run Tests with Coverage (80%+)
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install rouge-score  # For prompt tests
          
      - name: Create tests directory if not exists
        run: |
          mkdir -p tests
          
      - name: Run pytest with coverage
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "Running tests with coverage..."
          pytest tests/ -v \
            --cov=src \
            --cov-report=term \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            --ignore=tests/test_prompts.py
        continue-on-error: false
        
      - name: Run RAG-specific tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "Running RAG pipeline tests..."
          pytest tests/test_rag.py -v --tb=short || echo "RAG tests completed"
          
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          
      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          
      - name: Coverage summary
        if: success()
        run: echo "✅ Test coverage meets minimum threshold of 80%"

  # ==================== JOB 5: SECURITY SCAN ====================
  security:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit==2.6.3
          
      - name: Run pip-audit for vulnerabilities
        run: |
          echo "========================================"
          echo "Security Vulnerability Scan"
          echo "========================================"
          
          # Run pip-audit, ignoring vulnerabilities with no fix available
          # GHSA-wf7f-8fxf-xfxc: MLflow vulnerability with no fix as of Dec 2025
          pip-audit --vulnerability-service osv --format columns \
            --ignore-vuln GHSA-wf7f-8fxf-xfxc \
            2>&1 | tee audit-results.txt || true
          
          echo ""
          echo "========================================"
          echo "Checking for CRITICAL/HIGH vulnerabilities..."
          echo "========================================"
          
          # Check for critical vulnerabilities (fail the build)
          if grep -iE "critical" audit-results.txt; then
            echo ""
            echo "❌ CRITICAL vulnerabilities found! Failing build."
            exit 1
          fi
          
          # Warn about high vulnerabilities but don't fail
          if grep -iE "high" audit-results.txt; then
            echo ""
            echo "⚠️ HIGH severity vulnerabilities found. Please review."
          fi
          
          # Check if no vulnerabilities found
          if grep -q "No known vulnerabilities found" audit-results.txt; then
            echo ""
            echo "✅ No known vulnerabilities detected!"
          else
            echo ""
            echo "⚠️ Some vulnerabilities detected. Review audit-results.txt"
          fi
        continue-on-error: false
        
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit
          path: audit-results.txt

  # ==================== JOB 6: BUILD & PUSH RAG API DOCKER ====================
  build:
    name: Build & Push RAG API Docker Image
    runs-on: ubuntu-latest
    needs: [test, security, prompt-evaluation]
    permissions:
      contents: read
      packages: write
      
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      
    steps:
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          # Remove unnecessary large packages
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "Disk space after cleanup:"
          df -h
          
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=rag-api-${{ github.sha }}
            
      - name: Build and push RAG API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          
      - name: Image digest
        run: |
          echo "✅ RAG API Docker image built and pushed successfully!"
          echo "Image tags: ${{ steps.meta.outputs.tags }}"

  # ==================== JOB 7: CANARY DEPLOYMENT FOR LLM SERVICE ====================
  canary-deploy-llm:
    name: Canary Deploy LLM/RAG Service
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker image prune --all --force
          
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Pull Docker image
        run: |
          docker pull $REGISTRY/$IMAGE_NAME_LC:${{ github.sha }}
          
      - name: Stop existing canary containers
        run: |
          docker stop aqi-canary || true
          docker rm aqi-canary || true
          docker stop rag-canary || true
          docker rm rag-canary || true
          
      - name: Deploy RAG API to Canary environment
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "Deploying RAG API to canary environment..."
          
          # Check for required secrets
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "WARNING: AWS credentials not found. Model loading from S3 will fail."
          else
            echo "✅ AWS credentials available"
          fi
          
          if [ -z "$GROQ_API_KEY" ]; then
            echo "WARNING: GROQ_API_KEY not found. RAG LLM features will be limited."
          else
            echo "✅ GROQ_API_KEY available for LLM features"
          fi
          
          # Deploy with RAG/LLM environment variables
          docker run -d \
            --name aqi-canary \
            -p 8001:8000 \
            -e CANARY=true \
            -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
            -e GROQ_API_KEY=$GROQ_API_KEY \
            $REGISTRY/$IMAGE_NAME_LC:${{ github.sha }}
          
          echo "RAG API canary container started..."
          sleep 5
          docker logs aqi-canary || echo "Could not get logs yet"
          
      - name: Wait for RAG API to be ready
        run: |
          echo "Waiting for RAG API service to start..."
          sleep 15
          
          # Check if service is responding
          for i in {1..20}; do
            if curl -f http://localhost:8001/health >/dev/null 2>&1; then
              echo "✅ Service is responding!"
              break
            else
              echo "Attempt $i: Service not responding yet, waiting..."
              sleep 5
            fi
          done
          
          # Wait for models to load (5 minute timeout)
          echo "Waiting for models to load from S3..."
          if timeout 300 bash -c 'until curl -s http://localhost:8001/health 2>/dev/null | grep -q "\"status\":\"healthy\""; do 
            echo "Models not loaded yet, retrying in 10 seconds..."; 
            curl -s http://localhost:8001/health 2>/dev/null || echo "No response"
            sleep 10; 
          done'; then
            echo "✅ Canary service is healthy!"
          else
            echo "⚠️ Service health check timeout - checking status..."
            health_response=$(curl -s http://localhost:8001/health 2>/dev/null || echo "{}")
            echo "$health_response"
            docker logs aqi-canary || true
            
            if echo "$health_response" | grep -q "status"; then
              echo "Service responding, proceeding with tests..."
            else
              echo "❌ Service not responding. Failing deployment."
              exit 1
            fi
          fi
          
          echo "Final health check:"
          curl -s http://localhost:8001/health | python3 -m json.tool || true
          
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install test dependencies
        run: |
          pip install requests pytest
          
      - name: Run LLM/RAG Acceptance Tests
        run: |
          cat > rag_acceptance_tests.py << 'EOF'
          import requests
          import sys
          import json
          
          BASE_URL = "http://localhost:8001"
          
          # Golden test set including RAG/LLM endpoints
          test_cases = [
              # Core API tests
              {"name": "Health Check", "method": "GET", "endpoint": "/health"},
              {"name": "Root Endpoint", "method": "GET", "endpoint": "/"},
              {"name": "Current Hour Prediction", "method": "GET", "endpoint": "/api/predict/current"},
              {"name": "3-Day Forecast", "method": "GET", "endpoint": "/api/predict?days=3"},
              {"name": "Hourly Forecast", "method": "GET", "endpoint": "/api/predict/hourly?hours=24"},
              {"name": "Daily Summary", "method": "GET", "endpoint": "/api/predict/daily?days=3"},
              
              # RAG API tests
              {"name": "RAG Sources", "method": "GET", "endpoint": "/api/rag/sources"},
              {"name": "RAG Guardrails Stats", "method": "GET", "endpoint": "/api/rag/guardrails/stats"},
          ]
          
          # RAG Query test (separate due to POST and potential LLM dependency)
          rag_query_test = {
              "name": "RAG Query - Valid AQI Question",
              "method": "POST",
              "endpoint": "/api/rag/query",
              "data": {"query": "What precautions should I take when AQI is 150?"}
          }
          
          failed = 0
          passed = 0
          warnings = 0
          
          print("=" * 70)
          print("RAG API Acceptance Tests - Canary Environment")
          print("=" * 70)
          
          # Run core tests
          for i, test in enumerate(test_cases, 1):
              print(f"\nTest {i}/{len(test_cases)+1}: {test['name']}")
              try:
                  if test['method'] == 'GET':
                    